<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Grupo Farol</title>
  <link rel="stylesheet" href="/assets/css/output.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center font-sans">

  <div class="w-full max-w-sm px-6">
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-bold text-brand-black tracking-tight">Grupo Farol</h1>
      <p class="text-sm text-gray-500 mt-1">Painel Administrativo</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <form id="login-form" novalidate>
        <div class="mb-5">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
            E-mail
          </label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            placeholder="seuemail@grupofarol.com"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent transition"
            aria-describedby="login-error"
          />
        </div>

        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
            Senha
          </label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent transition"
            aria-describedby="login-error"
          />
        </div>

        <div
          id="login-error"
          role="alert"
          aria-live="assertive"
          class="hidden mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700"
        >
          E-mail ou senha incorretos.
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="w-full rounded-lg bg-brand-red px-4 py-2.5 text-sm font-semibold text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-brand-red focus:ring-offset-2 transition disabled:opacity-60 disabled:cursor-not-allowed"
        >
          Entrar
        </button>
      </form>
    </div>
  </div>

  <script>
    (async () => {
      // Load public Supabase keys from server (keeps credentials out of source)
      const cfg = await fetch('/api/config').then(r => r.json())
      const supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey)

      // If already authenticated, go straight to dashboard
      const { data: { session } } = await supabase.auth.getSession()
      if (session) {
        location.href = '/admin/dashboard.html'
        return
      }

      const form     = document.getElementById('login-form')
      const errorEl  = document.getElementById('login-error')
      const submitBtn = document.getElementById('submit-btn')

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        errorEl.classList.add('hidden')
        submitBtn.disabled = true
        submitBtn.textContent = 'Entrando…'

        const email    = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value

        const { error } = await supabase.auth.signInWithPassword({ email, password })

        if (error) {
          errorEl.classList.remove('hidden')
          submitBtn.disabled = false
          submitBtn.textContent = 'Entrar'
          document.getElementById('password').value = ''
          document.getElementById('password').focus()
          return
        }

        location.href = '/admin/dashboard.html'
      })
    })()
  </script>

</body>
</html>
