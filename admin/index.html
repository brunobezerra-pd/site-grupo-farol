<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Grupo Farol</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/assets/css/output.css" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-poppins">

  <a href="#login-form" class="skip-link">Pular para o formulário de login</a>

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 py-4 px-6" role="banner">
    <a href="/admin/" aria-label="Grupo Farol — Painel Admin">
      <img src="/assets/images/LogoGrupoFarol.png" alt="Grupo Farol" class="h-[40px] w-auto block object-contain" />
    </a>
  </header>

  <!-- Main -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">
      <h1 class="text-2xl font-semibold text-gray-800 mb-1">Entrar</h1>
      <p class="text-sm text-gray-500 mb-8">Acesso restrito ao painel de administração.</p>

      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            placeholder="seu@email.com"
            class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-farol-burning-red focus:border-transparent transition"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="••••••••"
            class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-farol-burning-red focus:border-transparent transition"
          />
        </div>

        <!-- Error message -->
        <div
          id="error-msg"
          role="alert"
          aria-live="assertive"
          class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-4 py-3"
        ></div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full py-2.5 px-4 bg-farol-burning-red text-white text-sm font-semibold rounded-lg hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-farol-burning-red focus:ring-offset-2 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Entrar
        </button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (async function () {
      const DASHBOARD = '/admin/dashboard.html'

      // ── Load public config from server ─────────────────────────────────────
      let supabase
      try {
        const cfg = await fetch('/api/config').then(r => r.json())
        supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey)
      } catch (err) {
        showError('Não foi possível conectar ao servidor. Tente novamente.')
        return
      }

      // ── Redirect if already authenticated ─────────────────────────────────
      const { data: { session } } = await supabase.auth.getSession()
      if (session) return (location.href = DASHBOARD)

      // ── Login form ─────────────────────────────────────────────────────────
      const form      = document.getElementById('login-form')
      const submitBtn = document.getElementById('submit-btn')

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        hideError()
        setLoading(true)

        const email    = document.getElementById('email').value.trim()
        const password = document.getElementById('password').value

        const { error } = await supabase.auth.signInWithPassword({ email, password })

        if (error) {
          showError('Email ou senha incorretos.')
          setLoading(false)
          return
        }

        location.href = DASHBOARD
      })

      function showError(msg) {
        const el = document.getElementById('error-msg')
        el.textContent = msg
        el.classList.remove('hidden')
      }
      function hideError() {
        document.getElementById('error-msg').classList.add('hidden')
      }
      function setLoading(loading) {
        submitBtn.disabled    = loading
        submitBtn.textContent = loading ? 'Entrando…' : 'Entrar'
      }
    })()
  </script>

</body>
</html>
