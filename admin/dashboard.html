<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard — Grupo Farol</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/assets/css/output.css" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-poppins text-sm">

  <a href="#main-content" class="skip-link">Pular para o conteúdo</a>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between" role="banner">
    <a href="/admin/dashboard.html" aria-label="Grupo Farol — Painel Admin">
      <img src="/assets/images/LogoGrupoFarol.png" alt="Grupo Farol" class="h-[32px] w-auto block object-contain" />
    </a>
    <button
      id="signout-btn"
      type="button"
      class="text-xs font-medium text-gray-500 hover:text-gray-800 focus:outline-none focus:underline transition"
    >
      Sair
    </button>
  </header>

  <!-- ── Tab bar ─────────────────────────────────────────────────────────── -->
  <div class="bg-white border-b border-gray-200 overflow-x-auto">
    <div
      role="tablist"
      aria-label="Seções do painel"
      class="flex min-w-max px-6"
    >
      <button role="tab" data-tab="hero"     id="tab-hero"     aria-controls="panel-hero"     aria-selected="true"  class="admin-tab">Hero</button>
      <button role="tab" data-tab="about"    id="tab-about"    aria-controls="panel-about"    aria-selected="false" class="admin-tab">Sobre</button>
      <button role="tab" data-tab="talents"  id="tab-talents"  aria-controls="panel-talents"  aria-selected="false" class="admin-tab">Talentos</button>
      <button role="tab" data-tab="partners" id="tab-partners" aria-controls="panel-partners" aria-selected="false" class="admin-tab">Parceiros</button>
      <button role="tab" data-tab="cta"      id="tab-cta"      aria-controls="panel-cta"      aria-selected="false" class="admin-tab">CTA Final</button>
      <button role="tab" data-tab="settings" id="tab-settings" aria-controls="panel-settings" aria-selected="false" class="admin-tab">Configurações</button>
    </div>
  </div>

  <!-- ── Main content ────────────────────────────────────────────────────── -->
  <main id="main-content" class="flex-1 px-6 py-8 max-w-3xl w-full mx-auto">

    <!-- Hero panel -->
    <section role="tabpanel" id="panel-hero" aria-labelledby="tab-hero">
      <h2 class="admin-section-title">Hero</h2>
      <!-- Form fields injected by admin.js (ISSUE 10) -->
      <div id="hero-fields" class="space-y-5"></div>
      <div class="mt-6">
        <button type="button" id="save-hero" class="admin-save-btn">Salvar Hero</button>
      </div>
    </section>

    <!-- About panel -->
    <section role="tabpanel" id="panel-about" aria-labelledby="tab-about" hidden>
      <h2 class="admin-section-title">Sobre</h2>
      <!-- Form fields injected by admin.js (ISSUE 10) -->
      <div id="about-fields" class="space-y-5"></div>
      <!-- Image slot: about_image_url -->
      <div id="slot-about-image" class="mt-6"></div>
      <div class="mt-6">
        <button type="button" id="save-about" class="admin-save-btn">Salvar Sobre</button>
      </div>
    </section>

    <!-- Talents panel -->
    <section role="tabpanel" id="panel-talents" aria-labelledby="tab-talents" hidden>
      <h2 class="admin-section-title">Talentos</h2>
      <!-- Creator list + add form injected by admin.js (ISSUE 11) -->
      <div id="talents-content"></div>
    </section>

    <!-- Partners panel -->
    <section role="tabpanel" id="panel-partners" aria-labelledby="tab-partners" hidden>
      <h2 class="admin-section-title">Parceiros</h2>
      <!-- Partner grid + add form injected by admin.js (ISSUE 12) -->
      <div id="partners-content"></div>
    </section>

    <!-- Final CTA panel -->
    <section role="tabpanel" id="panel-cta" aria-labelledby="tab-cta" hidden>
      <h2 class="admin-section-title">CTA Final</h2>
      <!-- Form fields injected by admin.js (ISSUE 12) -->
      <div id="cta-fields" class="space-y-5"></div>
      <!-- Image slot: cta_final_image_url -->
      <div id="slot-cta-image" class="mt-6"></div>
      <div class="mt-6">
        <button type="button" id="save-cta" class="admin-save-btn">Salvar CTA Final</button>
      </div>
    </section>

    <!-- Settings panel -->
    <section role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
      <h2 class="admin-section-title">Configurações</h2>
      <!-- Settings fields injected by admin.js (ISSUE 12) -->
      <div id="settings-fields" class="space-y-5"></div>
      <div class="mt-6">
        <button type="button" id="save-settings" class="admin-save-btn">Salvar Configurações</button>
      </div>
    </section>

  </main>

  <!-- ── Toast notification ───────────────────────────────────────────────── -->
  <div
    id="toast"
    role="alert"
    aria-live="polite"
    aria-atomic="true"
    class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-lg text-white text-sm font-medium shadow-lg opacity-0 translate-y-2 transition-all duration-300 pointer-events-none"
  ></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/js/admin.js"></script>

</body>
</html>
