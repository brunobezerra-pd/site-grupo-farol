<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Grupo Farol — A maior agência de creators da América Latina." />
  <title>Grupo Farol</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">

  <!-- OpenGraph -->
  <meta property="og:title" content="Grupo Farol" />
  <meta property="og:description" content="A maior agência de creators da América Latina" />
  <meta property="og:image" content="/assets/images/OpenGraph.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://grupofarol.com.br" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/assets/images/OpenGraph.png" />

  <link rel="stylesheet" href="/assets/css/output.css" />
</head>
<body class="bg-farol-beige overflow-x-hidden">

  <a href="#main-content" class="skip-link" data-i18n="a11y.skipToContent">Pular para o conteúdo</a>

  <!-- ═══════════════════════════════════════════════════════════════════════
       HEADER
       Desktop  : no logo, full horizontal nav (right-aligned, Foun font)
       Tablet/Mobile : logo + hamburger — implemented in ISSUE 14
       ═══════════════════════════════════════════════════════════════════════ -->
  <header role="banner" class="absolute top-0 left-0 w-full z-50 px-[30px] md:px-[64px] lg:px-[120px]">
    <nav aria-label="Navegação principal">

      <!-- ── Desktop nav (≥ 1024px) ── -->
      <div class="hidden lg:flex items-center justify-end h-[90px]">
        <ul class="flex items-center gap-[64px] list-none m-0 p-0" role="list">
          <li>
            <a href="#sobre"
               class="font-foun text-[32px] text-farol-text hover:opacity-70 transition-opacity focus:outline-none focus:underline"
               data-i18n="nav.sobre">SoBre</a>
          </li>
          <li>
            <a href="#talentos"
               class="font-foun text-[32px] text-farol-text hover:opacity-70 transition-opacity focus:outline-none focus:underline"
               data-i18n="nav.talentos">TALENTOS</a>
          </li>
          <li>
            <a href="#como-trabalhamos"
               class="font-foun text-[32px] text-farol-text hover:opacity-70 transition-opacity focus:outline-none focus:underline"
               data-i18n="nav.comoTrabalhamos">Como TrAbALHAMOS</a>
          </li>
          <li>
            <a href="#fale-com-o-farol"
               id="nav-contact-link"
               class="font-foun text-[32px] text-farol-text hover:opacity-70 transition-opacity btn-cta-hover focus:outline-none focus:underline"
               data-i18n="nav.faleConosco">FAle conOsco</a>
          </li>
        </ul>
      </div>

      <!-- ── Tablet / Mobile nav (< 1024px) — ISSUE 14 ── -->
      <div class="flex lg:hidden items-center justify-between h-[50px]" id="mobile-header">
        <!-- Logo (shown on tablet/mobile only) -->
        <a href="/" aria-label="Grupo Farol — página inicial" id="mobile-logo">
          <img src="/assets/images/LogoGrupoFarol.png" alt="Grupo Farol" class="h-[32px] w-auto block object-contain" />
        </a>

        <!-- Hamburger button -->
        <button
          type="button"
          id="hamburger-btn"
          aria-expanded="false"
          aria-controls="mobile-menu"
          aria-label="Abrir menu"
          class="flex flex-col justify-center items-center w-10 h-10 gap-1.5 focus:outline-none focus:ring-2 focus:ring-farol-text rounded"
        >
          <span class="block w-6 h-0.5 bg-farol-burning-red transition-all duration-200" aria-hidden="true"></span>
          <span class="block w-6 h-0.5 bg-farol-orange transition-all duration-200" aria-hidden="true"></span>
          <span class="block w-6 h-0.5 bg-farol-blue transition-all duration-200" aria-hidden="true"></span>
        </button>
      </div>

      <!-- ── Mobile dropdown menu — ISSUE 14 ── -->
      <div
        id="mobile-menu"
        class="hidden lg:hidden bg-farol-yellow pb-4"
        role="menu"
        aria-label="Menu de navegação"
      >
        <ul class="flex flex-col list-none m-0 p-0" role="list">
          <li role="none">
            <a href="#sobre"
               role="menuitem"
               class="block py-3 font-foun text-2xl text-farol-text hover:opacity-70 transition-opacity focus:outline-none focus:underline"
               data-i18n="nav.sobre">SoBre</a>
          </li>
          <li role="none">
            <a href="#talentos"
               role="menuitem"
               class="block py-3 font-foun text-2xl text-farol-text hover:opacity-70 transition-opacity focus:outline-none focus:underline"
               data-i18n="nav.talentos">TALENTOS</a>
          </li>
          <li role="none">
            <a href="#como-trabalhamos"
               role="menuitem"
               class="block py-3 font-foun text-2xl text-farol-text hover:opacity-70 transition-opacity focus:outline-none focus:underline"
               data-i18n="nav.comoTrabalhamos">Como TrAbALHAMOS</a>
          </li>
          <li role="none">
            <a href="#fale-com-o-farol"
               id="mobile-contact-link"
               role="menuitem"
               class="block py-3 font-foun text-2xl text-farol-text hover:opacity-70 transition-opacity btn-cta-hover focus:outline-none focus:underline"
               data-i18n="nav.faleConosco">FAle conOsco</a>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- ═══════════════════════════════════════════════════════════════════════
       MAIN CONTENT
       ═══════════════════════════════════════════════════════════════════════ -->
  <main id="main-content">

    <!-- ── Hero — ISSUE 15/16 ── -->
    <section
      aria-labelledby="hero-heading"
      class="bg-farol-yellow rounded-b-[48px] overflow-hidden relative lg:min-h-[800px] flex flex-col lg:pb-[144px] lg:px-[120px]"
    >
      <!-- Skeleton loader (visible during API fetch) -->
      <div id="hero-skeleton"
           class="animate-pulse px-[30px] md:px-[64px] lg:px-0 pt-[72px] pb-[72px] lg:pb-0 flex-1 flex flex-col justify-center lg:flex-row lg:items-start lg:w-full"
           aria-hidden="true">
        <div class="flex items-start gap-6">
          <div class="hidden lg:block w-[113px] shrink-0"></div>
          <div class="flex-1 flex flex-col items-end gap-8">
            <div class="h-40 lg:h-[474px] bg-farol-black/10 rounded-2xl w-full lg:max-w-[1066px]"></div>
            <div class="h-8 lg:h-[52px] bg-farol-black/10 rounded-xl w-3/4"></div>
            <div class="flex flex-col lg:flex-row gap-4 lg:gap-[56px] w-full lg:w-auto">
              <div class="h-14 lg:h-[92px] w-full lg:w-[480px] bg-farol-black/10 rounded-full"></div>
              <div class="h-14 lg:h-[92px] w-full lg:w-[360px] bg-farol-black/10 rounded-full"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Hero content — populated by renderHero() in main.js -->
      <div id="hero-content"
           class="hidden px-[30px] md:px-[64px] lg:px-0 pt-[72px] pb-[72px] lg:pb-0 lg:w-full">
      </div>
    </section>

    <!-- ── About (Sobre) — ISSUE 17 ── -->
    <section aria-labelledby="about-heading" id="sobre" class="bg-farol-beige">
      <h2 id="about-heading" class="sr-only" data-i18n="about.heading">Sobre o Grupo Farol</h2>

      <!-- Skeleton loader (visible during API fetch) -->
      <div id="about-skeleton"
           class="animate-pulse px-[30px] md:px-[64px] lg:px-[120px] py-[72px]"
           aria-hidden="true">
        <div class="flex flex-col lg:flex-row gap-[40px] lg:gap-[105px]">
          <!-- Left col skeleton -->
          <div class="flex flex-1 flex-col gap-[24px]">
            <div class="h-[200px] md:h-[310px] lg:h-[420px] bg-farol-black/10 rounded-2xl w-full"></div>
            <div class="h-[120px] bg-farol-black/10 rounded-xl w-full"></div>
          </div>
          <!-- Right col skeleton -->
          <div class="flex flex-col gap-[32px] w-full lg:w-[713px]">
            <div class="h-[384px] bg-farol-black/10 rounded-2xl w-full"></div>
            <div class="flex flex-col md:flex-row gap-[16px] md:gap-0 md:justify-between">
              <div class="h-[126px] md:h-[201px] lg:h-[269px] bg-farol-black/10 rounded-[24px] w-full md:w-[32%]"></div>
              <div class="h-[150px] md:h-[201px] lg:h-[269px] bg-farol-black/10 rounded-[24px] w-full md:w-[32%]"></div>
              <div class="h-[150px] md:h-[201px] lg:h-[269px] bg-farol-black/10 rounded-[24px] w-full md:w-[32%]"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Content injected by renderAbout() in main.js -->
      <div id="about-content" class="hidden"></div>
    </section>

    <!-- ── Creators / Category Tags — ISSUE 18 ── -->
    <!-- h2#creators-heading is rendered inside #creators-content by renderCreators() -->
    <section aria-labelledby="creators-heading" id="nossos-creators">
      <div id="creators-content"></div>
    </section>

    <!-- ── Featured Talents Slider — ISSUE 19/20 ── -->
    <section
      id="talentos"
      aria-labelledby="talents-heading"
      role="region"
      aria-label="Featured talents"
      aria-live="polite"
    >
      <h2 id="talents-heading" class="sr-only" data-i18n="talents.heading">Talentos em Destaque</h2>
      <div id="talents-slider">
        <!-- Skeleton loader (visible during API fetch) -->
        <div class="bg-farol-burning-red overflow-visible px-[30px] md:px-[64px] lg:px-[120px] py-[72px] lg:rounded-[48px] relative animate-pulse">
          <div class="flex flex-col items-start relative w-full mb-[72px]">
            <div class="w-full h-[150px] bg-farol-black/20 rounded-[24px]"></div>
          </div>
          <div class="flex gap-[24px] overflow-hidden pb-[72px]">
              <div class="bg-farol-beige rounded-[24px] p-[12px] flex flex-col gap-[23px] relative shrink-0 w-full md:w-[420px] lg:w-[497px]">
                <div class="rounded-[16px] bg-[#e0d5c7] h-[320px]"></div>
                <div class="flex flex-col gap-[12px] pb-[32px] px-[24px]">
                  <div class="h-[56px] bg-[#e0d5c7] rounded-[8px] w-3/4"></div>
                  <div class="h-[24px] bg-[#e0d5c7] rounded-[8px] w-1/2"></div>
                </div>
              </div>
              <div class="bg-farol-beige rounded-[24px] p-[12px] hidden md:flex flex-col gap-[23px] relative shrink-0 w-full md:w-[420px] lg:w-[497px]">
                <div class="rounded-[16px] bg-[#e0d5c7] h-[320px]"></div>
                <div class="flex flex-col gap-[12px] pb-[32px] px-[24px]">
                  <div class="h-[56px] bg-[#e0d5c7] rounded-[8px] w-3/4"></div>
                  <div class="h-[24px] bg-[#e0d5c7] rounded-[8px] w-1/2"></div>
                </div>
              </div>
              <div class="bg-farol-beige rounded-[24px] p-[12px] hidden lg:flex flex-col gap-[23px] relative shrink-0 w-full md:w-[420px] lg:w-[497px]">
                <div class="rounded-[16px] bg-[#e0d5c7] h-[320px]"></div>
                <div class="flex flex-col gap-[12px] pb-[32px] px-[24px]">
                  <div class="h-[56px] bg-[#e0d5c7] rounded-[8px] w-3/4"></div>
                  <div class="h-[24px] bg-[#e0d5c7] rounded-[8px] w-1/2"></div>
                </div>
              </div>
          </div>
        </div>
      </div>

    <!-- ── How We Work — ISSUE 21 ── -->
    <section aria-labelledby="how-heading" id="como-trabalhamos">
      <h2 id="how-heading" class="sr-only" data-i18n="how.heading">Como Trabalhamos</h2>
      <!-- Static content — ISSUE 21 -->
      <div id="how-content"></div>
    </section>

    <!-- ── Partners — ISSUE 22 ── -->
    <section aria-labelledby="partners-heading" id="contatos">
      <h2 id="partners-heading" class="sr-only" data-i18n="partners.heading">Parceiros</h2>
      <!-- Dynamic content — ISSUE 22 -->
      <div id="partners-content"></div>
    </section>

    <!-- ── Final CTA — ISSUE 23 ── -->
    <section aria-labelledby="cta-heading" id="fale-com-o-farol">
      <h2 id="cta-heading" class="sr-only" data-i18n="cta.heading">Fale com o Farol</h2>
      <!-- Dynamic content — ISSUE 23 -->
      <div id="cta-content"></div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════════════════════════════
       FOOTER — ISSUE 23
       ═══════════════════════════════════════════════════════════════════════ -->
  <footer role="contentinfo" id="footer-content">
    <!-- Content — ISSUE 23 -->
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/slider.js"></script>

</body>
</html>
